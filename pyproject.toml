[project]
name = "sleep-for-duration"
version = "0.1.2"
description = "Parses a duration string like '5s' or '2m' and suspends execution for that long."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
